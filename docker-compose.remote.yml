services:
  postgres:
    image: postgres:16-alpine
    container_name: executive-insights-postgres
    restart: unless-stopped
    env_file:
      - .env.remote
    volumes:
      - remote_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  mcp-remote:
    build:
      context: .
      dockerfile: Dockerfile.remote
    container_name: executive-insights-mcp
    restart: unless-stopped
    env_file:
      - .env.remote
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  remote_postgres_data:
